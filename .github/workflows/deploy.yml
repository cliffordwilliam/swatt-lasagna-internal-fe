name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /swatt-lasagna-internal-fe
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ZmFpdGhmdWwtZ2FubmV0LTE2LmNsZXJrLmFjY291bnRzLmRldiQ
          VITE_API_BASE_URL: https://swatt-lasagna-internal-api-production.up.railway.app
          CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=/swatt-lasagna-internal-fe/
          CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=/swatt-lasagna-internal-fe/
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4